AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  FR/EN assistant for French renting and work rules. The Docker image runs on AWS Lambda
  behind a public function URL and answers with a Mistral model on Amazon Bedrock; request
  logs go to CloudWatch, with a dashboard.
  Deploy with ./scripts/deploy_aws.sh (see docs/DEPLOY_AWS.md).

Parameters:
  AnswerModel:
    Type: String
    Default: mistral.ministral-3-14b-instruct
    Description: Bedrock model that writes the answers (Ministral 3 14B, by Mistral AI).
  BedrockRegion:
    Type: String
    Default: eu-west-1
    Description: Region where Bedrock serves the model (Ireland); the function can run elsewhere.

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: 30  # old logs are deleted, so storage stays free

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [arm64]  # built natively on an Apple Silicon Mac; also ~20% cheaper on Lambda
      MemorySize: 2048  # the embedding model and the index need ~1 GB; more memory also means more CPU
      # An answer takes 1-3 s, but the first request after a deployment waited about a minute
      # while Lambda fetched the 470 MB embedding model from the image (3 s on a laptop), and
      # timed out at 60 s. 120 s lets that request finish instead of failing.
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          LLM_PROVIDER: bedrock
          ANSWER_MODEL: !Ref AnswerModel
          BEDROCK_REGION: !Ref BedrockRegion
      # No API key: the function calls Bedrock with its own IAM role, allowed this one model only.
      Policies:
        - Statement:
            - Sid: CallTheAnswerModel
              Effect: Allow
              Action:  # the Converse API is authorised as InvokeModel
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: !Sub arn:${AWS::Partition}:bedrock:${BedrockRegion}::foundation-model/${AnswerModel}
      FunctionUrlConfig:
        AuthType: NONE  # public demo URL; see docs/DEPLOY_AWS.md for the cost guard
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: latest

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}
      # Logs Insights widgets read the JSON line the app writes for each request
      # (src/rag_assistant/monitoring.py). Lambda's own metrics come for free.
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown":
                "## FR/EN assistant: live requests\nOne log line per /ask and /search call. No question or answer text is stored. Answer quality is measured offline (see the README); these are warning signs."}},

              {"type": "log", "x": 0, "y": 2, "width": 12, "height": 6, "properties": {
                "title": "Requests per hour, by endpoint", "region": "${AWS::Region}", "view": "timeSeries", "stacked": true,
                "query": "SOURCE '${LogGroup}' | filter event = 'request' | stats count(*) as requests by endpoint, bin(1h)"}},

              {"type": "log", "x": 12, "y": 2, "width": 12, "height": 6, "properties": {
                "title": "Latency (ms) of successful requests: median and 95th percentile", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter event = 'request' and status = 200 | stats count(*) as requests, pct(latency_ms, 50) as p50_ms, pct(latency_ms, 95) as p95_ms by endpoint, lang"}},

              {"type": "log", "x": 0, "y": 8, "width": 12, "height": 6, "properties": {
                "title": "Failed requests (status >= 500; 503 = LLM not configured)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter event = 'request' and status >= 500 | stats count(*) as requests by endpoint, status, error"}},

              {"type": "log", "x": 12, "y": 8, "width": 12, "height": 6, "properties": {
                "title": "/ask answers with and without a citation, by language", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter endpoint = '/ask' and status = 200 | stats count(*) as answers, avg(n_citations) as avg_citations, avg(tool_calls) as avg_tool_calls by lang, no_citation"}},

              {"type": "log", "x": 0, "y": 14, "width": 12, "height": 6, "properties": {
                "title": "Tokens and estimated cost per day (Bedrock list prices, paid from AWS credits first)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter endpoint = '/ask' and status = 200 | stats count(*) as answers, sum(input_tokens) as total_input_tokens, sum(output_tokens) as total_output_tokens, sum(est_cost_usd) as total_est_cost_usd by bin(1d)"}},

              {"type": "log", "x": 12, "y": 14, "width": 12, "height": 6, "properties": {
                "title": "Retrieval: top score by method (hybrid = RRF scale, dense = cosine)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter event = 'request' and status = 200 | stats count(*) as requests, avg(top_score) as avg_top_score, min(top_score) as min_top_score, avg(n_pages) as avg_distinct_pages by endpoint, retrieval_method"}},

              {"type": "log", "x": 0, "y": 20, "width": 12, "height": 6, "properties": {
                "title": "Cold starts: time to load the index and the embedding model (ms)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter event = 'startup' | stats count(*) as cold_starts, avg(startup_ms) as avg_startup_ms, max(startup_ms) as max_startup_ms, avg(model_ms) as avg_model_ms by bin(1d)"}},

              {"type": "metric", "x": 12, "y": 20, "width": 12, "height": 6, "properties": {
                "title": "Lambda: invocations, errors, throttles", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${Function}"],
                  [".", "Errors", ".", "."],
                  [".", "Throttles", ".", "."]
                ]}},

              {"type": "log", "x": 0, "y": 26, "width": 24, "height": 4, "properties": {
                "title": "Lambda: timeouts, longest call and memory used (limit: memory_mb)", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter @type = 'REPORT' | stats count(*) as invocations, sum(strcontains(@message, 'Status: timeout')) as timeouts, max(@duration) as max_duration_ms, max(@maxMemoryUsed) / 1000 / 1000 as max_memory_used_mb, max(@memorySize) / 1000 / 1000 as memory_mb by bin(1d)"}},

              {"type": "log", "x": 0, "y": 30, "width": 24, "height": 6, "properties": {
                "title": "Last 20 requests", "region": "${AWS::Region}", "view": "table",
                "query": "SOURCE '${LogGroup}' | filter event = 'request' | fields @timestamp, endpoint, status, lang, latency_ms, retrieval_method, n_citations, tool_calls, input_tokens, output_tokens, error | sort @timestamp desc | limit 20"}}
            ]
          }
        - LogGroup: !Ref ApiLogGroup
          Function: !Ref ApiFunction

Outputs:
  ApiUrl:
    Description: Public URL of the API (open it in a browser for the demo page)
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  DashboardUrl:
    Description: CloudWatch dashboard with the request logs
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Dashboard}
  LogGroup:
    Description: Where the request logs are
    Value: !Ref ApiLogGroup
