name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src evaluation tests
      - run: pytest -q
        env:
          PYTHONPATH: src
      - name: Check the AWS template
        run: cfn-lint template.yaml

  retrieval-eval:
    name: Retrieval evaluation (regression thresholds)
    needs: tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: README numbers match the saved results
        run: python -m evaluation.report --check
      - name: Cache embedding model and index
        uses: actions/cache@v4
        with:
          path: |
            .cache/fastembed
            data/index
          key: index-${{ hashFiles('data/corpus/chunks.jsonl', 'src/rag_assistant/embeddings.py', 'src/rag_assistant/index.py', 'requirements.txt') }}
      - name: Build the vector index (skipped when cached)
        run: test -d data/index/qdrant || python -m rag_assistant.index
      - name: Retrieval eval, fail below thresholds
        run: python -m evaluation.retrieval_eval --check
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-results
          path: results/retrieval.json

  docker:
    name: Docker build and smoke test (${{ matrix.arch }})
    needs: tests
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64  # the architecture used on AWS Lambda
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fr-en-rag-assistant .
      - name: Run the container and call the API
        run: |
          docker run -d -p 8000:8000 --name app fr-en-rag-assistant
          ./scripts/smoke_test.sh http://localhost:8000
      - name: Run it like AWS Lambda does (read-only disk, writable /tmp only, unknown user)
        run: |
          docker run -d -p 8001:8000 --name lambda-like --read-only --tmpfs /tmp --user 993:993 fr-en-rag-assistant
          ./scripts/smoke_test.sh http://localhost:8001
      - if: always()
        run: |
          docker logs app || true
          docker logs lambda-like || true
