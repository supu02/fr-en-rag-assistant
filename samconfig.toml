# Settings for `sam build` and `sam deploy` (AWS SAM CLI). No secrets here:
# the Mistral key is passed by scripts/deploy_aws.sh, read from the local .env file.
version = 0.1

[default.global.parameters]
stack_name = "fr-en-rag-assistant"

[default.build.parameters]
cached = true

[default.deploy.parameters]
region = "eu-west-3"            # Paris
capabilities = "CAPABILITY_IAM"  # SAM creates the function's execution role
resolve_s3 = true                # small bucket SAM uses for deployment files
resolve_image_repos = true       # ECR repository for the Docker image, created by SAM
confirm_changeset = true         # show what will change and ask before deploying
fail_on_empty_changeset = false
